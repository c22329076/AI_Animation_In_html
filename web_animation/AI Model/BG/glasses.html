<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玻璃擬態（Glassmorphism）背景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* 底層容器：提供漸變背景，作為玻璃擬態的對比層 */
        .bg-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            /* 多彩漸變背景，凸顯玻璃效果 */
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899, #f97316);
            background-size: 400% 400%;
            /* 漸變緩慢動畫，增強視覺層次 */
            animation: gradientMove 60s ease infinite;
        }

        /* 裝飾性模糊形狀：讓背景更豐富，突出玻璃質感 */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(80px);
            z-index: 1;
        }
        .shape1 {
            width: 600px;
            height: 600px;
            top: -300px;
            left: -300px;
        }
        .shape2 {
            width: 500px;
            height: 500px;
            bottom: -250px;
            right: -250px;
        }

        /* 核心：玻璃擬態全屏背景層 */
        .glass-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 玻璃擬態核心屬性 */
            background: rgba(255, 255, 255, 0.08); /* 半透明白色底 */
            backdrop-filter: blur(12px); /* 毛玻璃模糊，關鍵！ */
            -webkit-backdrop-filter: blur(12px); /* 相容webkit核心瀏覽器（Chrome/Safari） */
            border: 1px solid rgba(255, 255, 255, 0.15); /* 半透明細邊框 */
            z-index: 2;
            pointer-events: none; /* 不遮擋下層互動（如有） */
        }



        /* 漸變背景動畫 */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

    </style>
</head>
<body>
    <!-- 底層漸變背景容器 -->
    <div class="bg-container">
        <!-- 裝飾性模糊形狀 -->
        <div class="bg-shape shape1"></div>
        <div class="bg-shape shape2"></div>
        
        <!-- 玻璃擬態全屏背景層 -->
        <div class="glass-bg"></div>


    </div>
</body>
</html>
